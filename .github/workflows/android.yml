name: Build Android APK
# beta  -> "Ikan Quests" (io.github.lostsubject18.ikan), server ikan.…,       release android-latest (testers)
# alpha -> "Ikan Alpha"  (io.github.lostsubject18.ikan.alpha), server ikan-alpha.…, release android-alpha
#          installs next to the beta app and never touches the testers' data
on:
  push:
    branches: [beta, alpha]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Channel settings
        run: |
          if [ "${GITHUB_REF_NAME}" = "beta" ]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
            echo "RELEASE=android-latest" >> "$GITHUB_ENV"
            echo "ASSET=ikan-quests.apk" >> "$GITHUB_ENV"
            echo "TITLE=Android (latest)" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=alpha" >> "$GITHUB_ENV"
            echo "RELEASE=android-alpha" >> "$GITHUB_ENV"
            echo "ASSET=ikan-alpha.apk" >> "$GITHUB_ENV"
            echo "TITLE=Android Alpha (development)" >> "$GITHUB_ENV"
            # point the alpha app at the alpha server
            node -e "const f='capacitor.config.json',c=require('./'+f);c.server.url='https://ikan-alpha.tail76472d.ts.net';c.server.allowNavigation=['ikan-alpha.tail76472d.ts.net'];c.appName='Ikan Alpha';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            sed -i 's#https://ikan.tail76472d.ts.net/#https://ikan-alpha.tail76472d.ts.net/#' www/offline.html
          fi
      - run: npm ci
      - run: npx cap sync android
      - name: Write signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 is missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ikan-release.p12"
      - name: Build signed release APK
        working-directory: mobile/android
        env:
          IKAN_KEYSTORE: ${{ runner.temp }}/ikan-release.p12
          IKAN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IKAN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IKAN_VERSION_CODE: ${{ github.run_number }}
          IKAN_CHANNEL: ${{ env.CHANNEL }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" "$RUNNER_TEMP/$ASSET"
      - name: Publish to the channel's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Ikan ($CHANNEL) for Android, build ${{ github.run_number }} ($(git rev-parse --short HEAD)). Needs Tailscale on the phone."
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" "$RUNNER_TEMP/$ASSET" --clobber
            gh release edit "$RELEASE" --notes "$NOTES"
          else
            gh release create "$RELEASE" "$RUNNER_TEMP/$ASSET" --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_REF_NAME"
          fi
